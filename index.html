<!DOCTYPE html>
<html lang="ja">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); min-height: 100vh; overflow-x: hidden; }
        .app-container { max-width: 100vw; min-height: 100vh; background: #fff; }
        .header { background: linear-gradient(135deg, #c0392b 0%, #8e44ad 100%); color: white; padding: 20px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .header h1 { font-size: 22px; margin-bottom: 8px; font-weight: 700; }

        .sync-status { margin-top: 12px; padding: 8px 12px; background: rgba(255,255,255,0.2); border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 8px; }

        .tab { flex: 1; min-width: 80px; padding: 14px 8px; text-align: center; background: #f8f9fa; border: none; font-size: 14px; font-weight: 600; color: #6c757d; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .tab.active { background: white; color: #8e44ad; border-bottom: 3px solid #8e44ad; }
        .content { padding: 16px; padding-bottom: 80px; }

        .section-title { font-size: 18px; font-weight: 700; color: #2c3e50; margin-bottom: 12px; padding-left: 12px; border-left: 4px solid #8e44ad; }
        .input-group { margin-bottom: 16px; }

        input:focus, select:focus, textarea:focus { outline: none; border-color: #8e44ad; }

        .search-option { padding: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .search-option:hover { background: #f8f9fa; }
        .selected-value { padding: 8px 12px; background: #e9ecef; border-radius: 6px; font-size: 14px; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .clear-btn { background: #dc3545; color: white; border: none; padding: 2px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-left: auto; }
        .soldier-types { display: flex; gap: 8px; flex-wrap: wrap; }
        .soldier-type-btn { flex: 1; min-width: 60px; padding: 12px 8px; border: 2px solid #dee2e6; background: white; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .soldier-type-btn.active { background: #8e44ad; color: white; border-color: #8e44ad; }
        .team-grid { display: grid; gap: 16px; }
        .team-card { background: #f8f9fa; border-radius: 12px; padding: 16px; border: 2px solid #dee2e6; position: relative; }
        .team-card h3 { font-size: 16px; color: #2c3e50; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #dee2e6; display: flex; justify-content: space-between; align-items: center; }
        .team-reorder-buttons { display: flex; gap: 4px; }

        .reorder-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .commander-slot { margin-bottom: 12px; }
        .aptitude-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-left: 8px; }
        .aptitude-S { background: #f39c12; color: white; }
        .aptitude-A { background: #3498db; color: white; }
        .aptitude-B { background: #2ecc71; color: white; }
        .aptitude-C { background: #95a5a6; color: white; }
        .strategy-slots { margin-top: 8px; padding: 12px; background: white; border-radius: 6px; }
        .strategy-slot { margin-bottom: 8px; }
        .tactics-section { margin-top: 12px; padding: 12px; background: #fff8e1; border-radius: 6px; border: 2px solid #ffc107; }
        .tactics-title { font-size: 13px; font-weight: 700; color: #856404; margin-bottom: 8px; }
        .tactics-slot { margin-bottom: 8px; }
        .image-upload-section { margin-top: 12px; padding: 12px; background: #e3f2fd; border-radius: 6px; border: 2px solid #2196f3; }
        .image-upload-title { font-size: 13px; font-weight: 700; color: #1976d2; margin-bottom: 8px; }
        .image-upload-input { display: none; }
        .image-upload-btn { background: #2196f3; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; width: 100%; }
        .image-preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .image-preview-item { position: relative; }
        .image-preview-img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; }
        .image-remove-btn { position: absolute; top: 2px; right: 2px; background: rgba(220, 53, 69, 0.9); color: white; border: none; padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer; }
        .strategy-warning { background: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 4px; }
        .strategy-error { background: #f8d7da; border: 1px solid #dc3545; color: #721c24; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 4px; }
        .strategy-info { background: #d1ecf1; border: 1px solid #17a2b8; color: #0c5460; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 4px; }
        .duplicate-error { background: #f8d7da; border: 2px solid #dc3545; color: #721c24; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 4px; font-weight: 600; }
        .btn { width: 100%; padding: 14px; background: #8e44ad; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
        .btn:active { transform: scale(0.98); background: #7d3c98; }
        .btn-secondary { background: #6c757d; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; }
        .saved-formation-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 2px solid #dee2e6; }
        .formation-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding-bottom: 12px; border-bottom: 1px solid #dee2e6; }
        .formation-title-section { flex: 1; }
        .formation-title { font-size: 18px; font-weight: 700; color: #2c3e50; margin-bottom: 4px; }
        .formation-date { font-size: 12px; color: #6c757d; }
        .accordion-icon { font-size: 24px; color: #6c757d; transition: transform 0.3s; user-select: none; }
        .accordion-icon.open { transform: rotate(180deg); }
        .formation-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .formation-content.open { max-height: 10000px; transition: max-height 0.5s ease-in; }
        .formation-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #dee2e6; }
        .formation-section-title { font-size: 14px; font-weight: 700; color: #6c757d; margin-bottom: 8px; }
        .mini-team { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .mini-team-header { font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
        .mini-team-memo { font-size: 11px; color: #2e7d32; background: #e8f5e9; padding: 4px 8px; border-radius: 3px; margin-bottom: 6px; }
        .mini-commander { font-size: 12px; color: #495057; margin-left: 8px; margin-bottom: 2px; }
        .mini-strategy, .mini-tactics { font-size: 11px; color: #6c757d; margin-left: 16px; }
        .mini-images { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .mini-image-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 3px; cursor: pointer; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
        .loading { text-align: center; padding: 40px; color: #6c757d; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; border-radius: 12px; padding: 24px; max-width: 400px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 700; color: #2c3e50; margin-bottom: 16px; }
        .modal-text { font-size: 14px; color: #6c757d; margin-bottom: 20px; }
        .modal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .internal-card { background: white; padding: 12px; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 12px; }
        .team-count-selector { background: white; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 2px solid #8e44ad; }
        .image-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .image-modal-content { max-width: 90%; max-height: 90%; }
        .image-modal-img { width: 100%; height: auto; max-height: 80vh; object-fit: contain; }
        .image-modal-close { position: absolute; top: 20px; right: 20px; background: white; color: #333; border: none; padding: 10px 15px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .upload-progress { margin-top: 12px; }
        .progress-bar-container { width: 100%; height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #8e44ad, #3498db); transition: width 0.3s; }
        .progress-text { font-size: 12px; color: #6c757d; margin-top: 4px; }
        .compress-info { background: #e8f5e9; border: 1px solid #4caf50; color: #2e7d32; padding: 6px 10px; border-radius: 4px; font-size: 11px; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        const SHEET_ID = '1s3q3t9Hk_LuVLnGLSFmPhcF8PjUILy8-CvBXWBtaSvI';
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0DpPZEkV8tgjb4AjN8aUAHsOJLjNo0SQj2gqlNFVMgxGhM40gmhMdqHNSMNpmydlXvw/exec';
        
        function App() {
            const [activeTab, setActiveTab] = useState('pvp');
            const [commanders, setCommanders] = useState([]);
            const [strategies, setStrategies] = useState([]);
            const [tactics, setTactics] = useState({ slot1: [], slot2Map: {}, slot34Map: {} });
            const [formations, setFormations] = useState([]);
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('未同期');
            const [editingFormationName, setEditingFormationName] = useState(null);
            const [numPvpTeams, setNumPvpTeams] = useState(5);
            const [numSiegeTeams, setNumSiegeTeams] = useState(5);
            const [useSpreadsheet, setUseSpreadsheet] = useState(false);
            const [formationName, setFormationName] = useState('');
            const [pvpTeams, setPvpTeams] = useState([]);
            const [siegeTeams, setSiegeTeams] = useState([]);
            const [internalCommanders, setInternalCommanders] = useState(Array(10).fill(null).map(() => ({
                commanderName: '', strategies: ['', ''], tactics: { slot1: '', slot2: '', slot3: '', slot4: '' }
            })));
            const [memo, setMemo] = useState('');

            useEffect(() => {
                if (SCRIPT_URL) setUseSpreadsheet(true);
            }, []);

            useEffect(() => {
                const createEmptyTeam = (soldierType) => ({
                    soldierType, memo: '', images: [], commanders: Array(3).fill(null).map(() => ({
                        commanderName: '', strategies: ['', ''], tactics: { slot1: '', slot2: '', slot3: '', slot4: '' }
                    }))
                });
                setPvpTeams(prev => Array(numPvpTeams).fill(null).map((_, i) => prev[i] || createEmptyTeam('槍')));
            }, [numPvpTeams]);

            useEffect(() => {
                const createEmptyTeam = (soldierType) => ({
                    soldierType, memo: '', images: [], commanders: Array(3).fill(null).map(() => ({
                        commanderName: '', strategies: ['', ''], tactics: { slot1: '', slot2: '', slot3: '', slot4: '' }
                    }))
                });
                setSiegeTeams(prev => Array(numSiegeTeams).fill(null).map((_, i) => prev[i] || createEmptyTeam('兵器')));
            }, [numSiegeTeams]);

            const loadData = useCallback(async () => {
                setLoading(true);
                setSyncStatus('読み込み中...');
                try {
                    const commandersUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=武将一覧`;
                    const commandersResponse = await fetch(commandersUrl);
                    const commandersText = await commandersResponse.text();
                    const commandersParsed = Papa.parse(commandersText, { header: true });
                    setCommanders(commandersParsed.data.filter(row => row['武将名'] && row['武将名'].trim()).map(row => ({
                        name: row['武将名'], faction: row['陣営'] || '', stars: parseInt(row['凸数']) || 0,
                        spear: row['槍'] || 'C', bow: row['弓'] || 'C', cavalry: row['馬'] || 'C',
                        shield: row['盾'] || 'C', siege: row['兵器'] || 'C'
                    })));

                    const strategiesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=戦法一覧`;
                    const strategiesResponse = await fetch(strategiesUrl);
                    const strategiesText = await strategiesResponse.text();
                    const strategiesParsed = Papa.parse(strategiesText, { header: true });
                    setStrategies(strategiesParsed.data.filter(row => row['戦法名'] && row['戦法名'].trim()).map(row => ({
                        name: row['戦法名'], type: row['種類'] || '', maxLearns: parseInt(row['学習数']) || 1
                    })));

                    const tacticsUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=兵法一覧`;
                    const tacticsResponse = await fetch(tacticsUrl);
                    const tacticsText = await tacticsResponse.text();
                    const tacticsParsed = Papa.parse(tacticsText, { header: false });
                    const tacticsData = { slot1: [], slot2Map: {}, slot34Map: {} };
                    tacticsParsed.data.forEach(row => {
                        const slot1Value = row[0];
                        if (slot1Value && slot1Value !== '第1スロット' && !tacticsData.slot1.includes(slot1Value)) {
                            tacticsData.slot1.push(slot1Value);
                            tacticsData.slot2Map[slot1Value] = [];
                            tacticsData.slot34Map[slot1Value] = [];
                        }
                    });
                    tacticsParsed.data.forEach(row => {
                        const slot1Value = row[0], slot2Value = row[1], slot34Value = row[2];
                        if (slot1Value && slot1Value !== '第1スロット') {
                            if (slot2Value && slot2Value !== '第2スロット' && !tacticsData.slot2Map[slot1Value].includes(slot2Value))
                                tacticsData.slot2Map[slot1Value].push(slot2Value);
                            if (slot34Value && slot34Value !== '第3・4スロット' && !tacticsData.slot34Map[slot1Value].includes(slot34Value))
                                tacticsData.slot34Map[slot1Value].push(slot34Value);
                        }
                    });
                    setTactics(tacticsData);

                    if (useSpreadsheet) await loadFormationsFromSpreadsheet();
                    else loadFormationsFromLocalStorage();

                    setSyncStatus('同期完了');
                    setTimeout(() => setSyncStatus(''), 2000);
                } catch (error) {
                    console.error('エラー:', error);
                    setSyncStatus('エラー');
                }
                setLoading(false);
            }, [useSpreadsheet]);

            const loadFormationsFromSpreadsheet = async () => {
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'list' })
                    });
                    const result = await response.json();
                    if (result.success && result.formations) {
                        setFormations(result.formations.sort((a, b) => new Date(b.date) - new Date(a.date)));
                    }
                } catch (error) {
                    console.error('スプレッドシート読み込みエラー:', error);
                    loadFormationsFromLocalStorage();
                }
            };

            const loadFormationsFromLocalStorage = () => {
                const saved = localStorage.getItem('formations_v3');
                if (saved) {
                    try {
                        setFormations(JSON.parse(saved).sort((a, b) => new Date(b.date) - new Date(a.date)));
                    } catch (e) { console.error('読み込みエラー'); }
                }
            };

            // JSONダウンロード機能
            const downloadFormationsJSON = () => {
                const dataStr = JSON.stringify(formations, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = `formations_backup_${new Date().toISOString().split('T')[0]}.json`;
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
            };

            useEffect(() => { loadData(); }, [loadData]);

            const getCommanderUsageMap = useCallback(() => {
                const usageMap = {};
                const recordUsage = (teams, teamType) => {
                    teams.forEach((team, teamIndex) => {
                        team.commanders.forEach((commander, cmdIndex) => {
                            if (commander.commanderName) {
                                if (!usageMap[commander.commanderName]) usageMap[commander.commanderName] = [];
                                usageMap[commander.commanderName].push(`${teamType}${teamIndex + 1}-武将${cmdIndex + 1}`);
                            }
                        });
                    });
                };
                recordUsage(pvpTeams, '対人');
                recordUsage(siegeTeams, '攻城');
                internalCommanders.forEach((commander, index) => {
                    if (commander.commanderName) {
                        if (!usageMap[commander.commanderName]) usageMap[commander.commanderName] = [];
                        usageMap[commander.commanderName].push(`内政${index + 1}`);
                    }
                });
                return usageMap;
            }, [pvpTeams, siegeTeams, internalCommanders]);

            const calculateStrategyUsage = useCallback(() => {
                const usage = {};
                const countStrategies = (teams) => {
                    teams.forEach(team => {
                        team.commanders.forEach(commander => {
                            commander.strategies.forEach(strategyName => {
                                if (strategyName) usage[strategyName] = (usage[strategyName] || 0) + 1;
                            });
                        });
                    });
                };
                countStrategies(pvpTeams);
                countStrategies(siegeTeams);
                internalCommanders.forEach(commander => {
                    commander.strategies.forEach(strategyName => {
                        if (strategyName) usage[strategyName] = (usage[strategyName] || 0) + 1;
                    });
                });
                return usage;
            }, [pvpTeams, siegeTeams, internalCommanders]);

            const validateStrategy = (strategyName) => {
                if (!strategyName) return { valid: true };
                const strategy = strategies.find(s => s.name === strategyName);
                if (!strategy) return { valid: true };
                const usage = calculateStrategyUsage();
                const currentUsage = usage[strategyName] || 0;
                if (currentUsage > strategy.maxLearns) {
                    return { valid: false, error: `${strategy.name}は学習上限(${strategy.maxLearns}回)を超えています (使用: ${currentUsage}回)` };
                }
                if (currentUsage === strategy.maxLearns) {
                    return { valid: true, warning: `${strategy.name}の学習回数が上限に達しています (${currentUsage}/${strategy.maxLearns})` };
                }
                return { valid: true, info: `${strategy.name} (使用: ${currentUsage}/${strategy.maxLearns})` };
            };

            const [showSaveModal, setShowSaveModal] = useState(false);
            const [showOverwriteConfirm, setShowOverwriteConfirm] = useState(false);

            const handleSaveClick = () => {
                if (!formationName.trim()) { alert('編成名を入力してください'); return; }
                const usageMap = getCommanderUsageMap();
                const duplicates = Object.entries(usageMap).filter(([_, locations]) => locations.length > 1);
                if (duplicates.length > 0) {
                    alert('武将の重複エラー:\n' + duplicates.map(([name, locations]) => `${name}: ${locations.join(', ')}`).join('\n'));
                    return;
                }

                // 同名の編成が存在するかチェック
                const existingFormation = formations.find(f => f.name === formationName);
                if (existingFormation && !editingFormationName) {
                    setShowOverwriteConfirm(true);
                } else if (editingFormationName) {
                    setShowSaveModal(true);
                } else {
                    saveAsNew();
                }
            };

            const saveAsNew = async () => {
                const formationData = { name: formationName, date: new Date().toISOString().split('T')[0], pvpTeams, siegeTeams, internalCommanders, memo };
                if (useSpreadsheet) {
                    setSyncStatus('保存中...');
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'create', data: formationData })
                        });
                        setSyncStatus('保存完了');
                        await loadFormationsFromSpreadsheet();
                    } catch (error) { console.error('保存エラー:', error); setSyncStatus('保存エラー'); }
                } else {
                    const saved = [formationData, ...formations].sort((a, b) => new Date(b.date) - new Date(a.date));
                    setFormations(saved);
                    localStorage.setItem('formations_v3', JSON.stringify(saved));
                }

        function SearchableSelect({ value, onChange, options, placeholder, renderOption, renderValue }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            const containerRef = useRef(null);
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (containerRef.current && !containerRef.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);
            // 部分一致検索に変更
            const filteredOptions = options.filter(option => 
                renderOption(option).toLowerCase().includes(searchTerm.toLowerCase())
            );
            const selectedOption = options.find(opt => opt.name === value);
            return (
                <div className="search-select-container" ref={containerRef}>
                    {selectedOption ? (
                        <div className="selected-value">
                            {renderValue ? renderValue(selectedOption) : renderOption(selectedOption)}
                            <button className="clear-btn" onClick={() => { onChange(''); setSearchTerm(''); }}>✕</button>
                        </div>
                    ) : (
                        <>
                            <input type="text" className="search-input" value={searchTerm} onChange={(e) => { setSearchTerm(e.target.value); setIsOpen(true); }} onFocus={() => setIsOpen(true)} placeholder={placeholder} />
                            {isOpen && filteredOptions.length > 0 && (
                                <div className="search-dropdown">
                                    {filteredOptions.map(option => (
                                        <div key={option.name} className="search-option" onClick={() => { onChange(option.name); setSearchTerm(''); setIsOpen(false); }}>
                                            {renderOption(option)}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }

        // 画像アップロードコンポーネント
        function ImageUpload({ teamImages, setTeamImages, teamIndex, teamType, formationName }) {
            const fileInputRef = useRef(null);
            const [imageModalSrc, setImageModalSrc] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0 });
            const [compressInfo, setCompressInfo] = useState(null);

            // 画像圧縮関数
            const compressImage = (file, maxSizeMB = 1.0) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            
                            // 最大幅・高さを設定（大きすぎる画像を縮小）
                            const maxDimension = 1920;
                            if (width > maxDimension || height > maxDimension) {
                                if (width > height) {
                                    height = (height / width) * maxDimension;
                                    width = maxDimension;
                                } else {
                                    width = (width / height) * maxDimension;
                                    height = maxDimension;
                                }
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            // 圧縮率を調整しながらBase64を生成
                            let quality = 0.8;
                            let compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                            
                            // 目標サイズ（MB）を超えている場合は品質を下げる
                            const targetSize = maxSizeMB * 1024 * 1024;
                            while (compressedDataUrl.length * 0.75 > targetSize && quality > 0.1) {
                                quality -= 0.1;
                                compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                            }
                            
                            const originalSizeKB = (file.size / 1024).toFixed(0);
                            const compressedSizeKB = ((compressedDataUrl.length * 0.75) / 1024).toFixed(0);
                            const reductionPercent = (((file.size - compressedDataUrl.length * 0.75) / file.size) * 100).toFixed(0);
                            
                            resolve({
                                dataUrl: compressedDataUrl,
                                originalSize: originalSizeKB,
                                compressedSize: compressedSizeKB,
                                reduction: reductionPercent
                            });
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            };

            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                setUploading(true);
                setUploadProgress({ current: 0, total: files.length });
                
                let uploadedCount = 0;
                const uploadedImages = []; // アップロード済み画像を溜める配列
                
                for (const file of files) {
                    if (file.type.startsWith('image/')) {
                        try {
                            // 画像を圧縮
                            const compressed = await compressImage(file);
                            
                            setCompressInfo({
                                fileName: file.name,
                                originalSize: compressed.originalSize,
                                compressedSize: compressed.compressedSize,
                                reduction: compressed.reduction
                            });
                            
                            // GoogleDriveにアップロード
                            const response = await fetch(SCRIPT_URL, {
                                method: 'POST',
                                body: JSON.stringify({
                                    action: 'uploadImage',
                                    imageData: compressed.dataUrl,
                                    fileName: file.name,
                                    formationName: formationName || '未設定編成',
                                    teamType: teamType,
                                    teamIndex: teamIndex
                                })
                            });
                            
                            const result = await response.json();
                            
                            if (result.success) {
                                // 配列に追加
                                uploadedImages.push({
                                    fileId: result.fileId,
                                    fileUrl: result.fileUrl,
                                    thumbnailUrl: result.thumbnailUrl,
                                    fileName: file.name
                                });
                                uploadedCount++;
                                setUploadProgress({ current: uploadedCount, total: files.length });
                            } else {
                                alert(`${file.name}: アップロードエラー - ${result.message}`);
                            }
                        } catch (error) {
                            console.error(`${file.name}: 処理エラー`, error);
                            alert(`${file.name}: 処理に失敗しました`);
                        }
                    }
                }
                
                // 全てアップロード完了後に一括でstateを更新
                if (uploadedImages.length > 0) {
                    const newImages = [...(teamImages || []), ...uploadedImages];
                    console.log('アップロード完了:', {
                        既存: teamImages?.length || 0,
                        新規: uploadedImages.length,
                        合計: newImages.length,
                        データ: newImages
                    });
                    setTeamImages(newImages);
                }
                
                e.target.value = '';
                setUploading(false);
                setUploadProgress({ current: 0, total: 0 });
                
                // 圧縮情報を3秒後にクリア
                setTimeout(() => setCompressInfo(null), 3000);
            };

            const removeImage = async (index) => {
                const imageToRemove = teamImages[index];
                
                if (imageToRemove.fileId) {
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'deleteImage',
                                fileId: imageToRemove.fileId
                            })
                        });
                    } catch (error) {
                        console.error('削除エラー:', error);
                    }
                }
                
                const newImages = teamImages.filter((_, i) => i !== index);
                setTeamImages(newImages);
            };

            return (
                <div className="image-upload-section">
                    <div className="image-upload-title">
                        参考画像
                        {uploading && ` (${uploadProgress.current}/${uploadProgress.total})`}
                    </div>
                    <div style={{fontSize: '10px', color: '#856404', background: '#fff3cd', padding: '6px', borderRadius: '4px', marginBottom: '8px'}}>
                        💡 画像は即座にGoogleDriveに保存されます。編成を保存しなくてもDriveには残ります。
                    </div>
                    <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        multiple
                        className="image-upload-input"
                        onChange={handleImageUpload}
                        disabled={uploading}
                    />
                    <button
                        className="image-upload-btn"
                        onClick={() => fileInputRef.current.click()}
                        disabled={uploading}
                    >
                        📷 画像を追加{uploading && '中...'}
                    </button>
                    
                    {uploading && (
                        <div className="upload-progress">
                            <div className="progress-bar-container">
                                <div 
                                    className="progress-bar" 
                                    style={{width: `${(uploadProgress.current / uploadProgress.total) * 100}%`}}
                                />
                            </div>
                            <div className="progress-text">
                                {uploadProgress.current} / {uploadProgress.total} 完了
                            </div>
                        </div>
                    )}
                    
                    {compressInfo && (
                        <div className="compress-info">
                            ✅ {compressInfo.fileName}: {compressInfo.originalSize}KB → {compressInfo.compressedSize}KB (約{compressInfo.reduction}%削減)
                        </div>
                    )}
                    
                    {teamImages && teamImages.length > 0 && (
                        <>
                            <div style={{fontSize: '11px', color: '#666', marginTop: '8px', marginBottom: '4px'}}>
                                画像 {teamImages.length}枚
                            </div>
                            <div className="image-preview-grid">
                                {teamImages.map((img, index) => (
                                    <div key={index} className="image-preview-item">
                                        <img
                                            src={img.thumbnailUrl || img}
                                            className="image-preview-img"
                                            onClick={() => {
                                                console.log('画像クリック:', img);
                                                setImageModalSrc(img.fileUrl || img);
                                            }}
                                            onError={(e) => {
                                                console.error('サムネイル読み込みエラー:', img);
                                                e.target.style.border = '2px solid red';
                                            }}
                                        />
                                        <button
                                            className="image-remove-btn"
                                            onClick={() => removeImage(index)}
                                        >
                                            ✕
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                    {imageModalSrc && (
                        <div className="image-modal-overlay" onClick={() => setImageModalSrc(null)}>
                            <button className="image-modal-close" onClick={() => setImageModalSrc(null)}>✕ 閉じる</button>
                            <div className="image-modal-content">
                                <img src={imageModalSrc} className="image-modal-img" />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

                                </h3>
                                <div className="input-group">
                                    <label className="input-label">兵種</label>
                                    <div className="soldier-types">
                                        {['槍', '弓', '馬', '盾', '兵器'].map(type => (
                                            <button key={type} className={`soldier-type-btn ${team.soldierType === type ? 'active' : ''}`} onClick={() => updateTeam(teamIndex, 'soldierType', type)}>{type}</button>
                                        ))}
                                    </div>
                                </div>
                                <div className="input-group">
                                    <label className="input-label">部隊メモ</label>
                                    <textarea value={team.memo} onChange={(e) => updateTeam(teamIndex, 'memo', e.target.value)} placeholder="この部隊の使い方など" />
                                </div>
                                {team.commanders.map((commander, commanderIndex) => (
                                    <div key={commanderIndex} className="commander-slot">
                                        <div className="input-group">
                                            <label className="input-label">武将 {commanderIndex + 1} {commanderIndex === 0 && '(主将)'}</label>
                                            <SearchableSelect
                                                value={commander.commanderName}
                                                onChange={(value) => updateCommander(teamIndex, commanderIndex, 'commanderName', value)}
                                                options={commanders}
                                                placeholder="武将を検索..."
                                                renderOption={(cmd) => `${cmd.name} [${cmd.faction}] ★${cmd.stars}`}
                                                renderValue={(cmd) => {
                                                    const aptKey = team.soldierType === '槍' ? 'spear' : team.soldierType === '弓' ? 'bow' : team.soldierType === '馬' ? 'cavalry' : team.soldierType === '盾' ? 'shield' : 'siege';
                                                    const apt = cmd[aptKey];
                                                    return (<>{cmd.name} [{cmd.faction}] ★{cmd.stars}<span className={`aptitude-badge aptitude-${apt}`}>{team.soldierType}: {apt}</span></>);
                                                }}
                                            />
                                            {commander.commanderName && usageMap[commander.commanderName] && usageMap[commander.commanderName].length > 1 && (
                                                <div className="duplicate-error">⚠️ 重複: {usageMap[commander.commanderName].join(', ')}</div>
                                            )}
                                        </div>
                                        <div className="strategy-slots">
                                            {commander.strategies.map((strategyName, strategyIndex) => (
                                                <div key={strategyIndex} className="strategy-slot">
                                                    <label className="input-label">戦法 {strategyIndex + 1}</label>
                                                    <SearchableSelect value={strategyName} onChange={(value) => updateStrategy(teamIndex, commanderIndex, strategyIndex, value)} options={strategies} placeholder="戦法を検索..." renderOption={(strat) => `${strat.name} [${strat.type}] (学習${strat.maxLearns}回)`} />
                                                    {strategyName && (() => {
                                                        const validation = validateStrategy(strategyName);
                                                        if (!validation.valid) return <div className="strategy-error">{validation.error}</div>;
                                                        if (validation.warning) return <div className="strategy-warning">{validation.warning}</div>;
                                                        if (validation.info) return <div className="strategy-info">{validation.info}</div>;
                                                    })()}
                                                </div>
                                            ))}
                                        </div>
                                        <TacticsSelector tactics={tactics} commanderTactics={commander.tactics} updateTactics={(tacticsData) => updateTacticsSlot(teamIndex, commanderIndex, tacticsData)} />
                                    </div>
                                ))}
                                <ImageUpload
                                    teamImages={team.images}
                                    setTeamImages={(images) => setTeamImages(teamIndex, images)}
                                    teamIndex={teamIndex}
                                    teamType={teamType}
                                    formationName={formationName}
                                />
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function InternalCommanders({ internalCommanders, setInternalCommanders, commanders, strategies, tactics, validateStrategy, getCommanderUsageMap }) {
            const updateCommander = (index, field, value) => {
                const updated = [...internalCommanders];
                updated[index] = { ...updated[index], [field]: value };
                setInternalCommanders(updated);
            };
            const updateStrategy = (index, strategyIndex, value) => {
                const updated = [...internalCommanders];
                updated[index].strategies[strategyIndex] = value;
                setInternalCommanders(updated);
            };
            const updateTacticsSlot = (index, tacticsData) => {
                const updated = [...internalCommanders];
                updated[index].tactics = tacticsData;
                setInternalCommanders(updated);
            };
            const usageMap = getCommanderUsageMap();
            return (
                <div className="section">
                    <div className="section-title">内政武将 (10人)</div>
                    {internalCommanders.map((commander, index) => (
                        <div key={index} className="internal-card">
                            <h4>内政武将 {index + 1}</h4>
                            <div className="input-group">
                                <label className="input-label">武将</label>
                                <SearchableSelect value={commander.commanderName} onChange={(value) => updateCommander(index, 'commanderName', value)} options={commanders} placeholder="武将を検索..." renderOption={(cmd) => `${cmd.name} [${cmd.faction}] ★${cmd.stars}`} />
                                {commander.commanderName && usageMap[commander.commanderName] && usageMap[commander.commanderName].length > 1 && (
                                    <div className="duplicate-error">⚠️ 重複: {usageMap[commander.commanderName].join(', ')}</div>
                                )}
                            </div>
                            <div className="strategy-slots">
                                {commander.strategies.map((strategyName, strategyIndex) => (
                                    <div key={strategyIndex} className="strategy-slot">
                                        <label className="input-label">戦法 {strategyIndex + 1}</label>
                                        <SearchableSelect value={strategyName} onChange={(value) => updateStrategy(index, strategyIndex, value)} options={strategies} placeholder="戦法を検索..." renderOption={(strat) => `${strat.name} [${strat.type}]`} />
                                        {strategyName && (() => {
                                            const validation = validateStrategy(strategyName);
                                            if (!validation.valid) return <div className="strategy-error">{validation.error}</div>;
                                            if (validation.warning) return <div className="strategy-warning">{validation.warning}</div>;
                                            if (validation.info) return <div className="strategy-info">{validation.info}</div>;
                                        })()}
                                    </div>
                                ))}
                            </div>
                            <TacticsSelector tactics={tactics} commanderTactics={commander.tactics} updateTactics={(tacticsData) => updateTacticsSlot(index, tacticsData)} />
                        </div>
                    ))}
                </div>
            );
        }

        function SavedFormations({ formations, commanders, strategies, loadFormation, copyFormation, deleteFormation }) {
            const [openIndex, setOpenIndex] = useState(null);
            const [imageModalSrc, setImageModalSrc] = useState(null);
            if (formations.length === 0) return (
                <div style={{textAlign: 'center', padding: '40px', color: '#6c757d'}}>
                    <div style={{fontSize: '48px'}}>📋</div>
                    <div>保存された編成はまだありません</div>
                </div>
            );
            const getAptitude = (commanderName, soldierType) => {
                const commander = commanders.find(c => c.name === commanderName);
                if (!commander) return '';
                const aptKey = soldierType === '槍' ? 'spear' : soldierType === '弓' ? 'bow' : soldierType === '馬' ? 'cavalry' : soldierType === '盾' ? 'shield' : 'siege';
                return commander[aptKey];
            };
            return (
                <div className="section">
                    <div className="section-title">保存済み編成 (新しい順)</div>
                    {formations.map((formation, index) => (
                        <div key={index} className="saved-formation-card">
                            <div className="formation-header" onClick={() => setOpenIndex(openIndex === index ? null : index)}>
                                <div className="formation-title-section">
                                    <div className="formation-title">{formation.name}</div>
                                    <div className="formation-date">{formation.date}</div>
                                </div>
                                <div className={`accordion-icon ${openIndex === index ? 'open' : ''}`}>▼</div>
                            </div>
                            <div className={`formation-content ${openIndex === index ? 'open' : ''}`}>
                                {formation.memo && <div style={{background: '#f8f9fa', padding: '10px', borderRadius: '6px', fontSize: '13px', marginTop: '12px'}}>{formation.memo}</div>}
                                <div className="formation-section">
                                    <div className="formation-section-title">対人戦部隊</div>
                                    {formation.pvpTeams && formation.pvpTeams.map((team, teamIndex) => {
                                        const hasCommanders = team.commanders.some(c => c.commanderName);
                                        if (!hasCommanders) return null;
                                        return (
                                            <div key={teamIndex} className="mini-team">
                                                <div className="mini-team-header">部隊{teamIndex + 1} [{team.soldierType}]</div>
                                                {team.memo && <div className="mini-team-memo">💡 {team.memo}</div>}
                                                {team.images && team.images.length > 0 && (
                                                    <div className="mini-images">
                                                        {team.images.map((img, imgIndex) => (
                                                            <img key={imgIndex} src={img.thumbnailUrl || img} className="mini-image-thumb" onClick={() => setImageModalSrc(img.fileUrl || img)} />
                                                        ))}
                                                    </div>
                                                )}
                                                {team.commanders.map((commander, cmdIndex) => {
                                                    if (!commander.commanderName) return null;
                                                    const apt = getAptitude(commander.commanderName, team.soldierType);
                                                    return (
                                                        <div key={cmdIndex}>
                                                            <div className="mini-commander">• {commander.commanderName}{apt && <span className={`aptitude-badge aptitude-${apt}`}>{apt}</span>}</div>
                                                            {commander.strategies.map((strat, sIndex) => {
                                                                if (!strat) return null;
                                                                return <div key={sIndex} className="mini-strategy">└ 戦法: {strat}</div>;
                                                            })}
                                                            {(commander.tactics.slot1 || commander.tactics.slot2 || commander.tactics.slot3 || commander.tactics.slot4) && (
                                                                <div className="mini-tactics">└ 兵法: {[commander.tactics.slot1, commander.tactics.slot2, commander.tactics.slot3, commander.tactics.slot4].filter(Boolean).join(', ')}</div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="formation-section">
                                    <div className="formation-section-title">攻城部隊</div>
                                    {formation.siegeTeams && formation.siegeTeams.map((team, teamIndex) => {
                                        const hasCommanders = team.commanders.some(c => c.commanderName);
                                        if (!hasCommanders) return null;
                                        return (
                                            <div key={teamIndex} className="mini-team">
                                                <div className="mini-team-header">攻城{teamIndex + 1} [兵器]</div>
                                                {team.memo && <div className="mini-team-memo">💡 {team.memo}</div>}
                                                {team.images && team.images.length > 0 && (
                                                    <div className="mini-images">
                                                        {team.images.map((img, imgIndex) => (
                                                            <img key={imgIndex} src={img.thumbnailUrl || img} className="mini-image-thumb" onClick={() => setImageModalSrc(img.fileUrl || img)} />
                                                        ))}
                                                    </div>
                                                )}
                                                {team.commanders.map((commander, cmdIndex) => {
                                                    if (!commander.commanderName) return null;
                                                    const apt = getAptitude(commander.commanderName, '兵器');
                                                    return (
                                                        <div key={cmdIndex}>
                                                            <div className="mini-commander">• {commander.commanderName}{apt && <span className={`aptitude-badge aptitude-${apt}`}>{apt}</span>}</div>
                                                            {commander.strategies.map((strat, sIndex) => {
                                                                if (!strat) return null;
                                                                return <div key={sIndex} className="mini-strategy">└ 戦法: {strat}</div>;
                                                            })}
                                                            {(commander.tactics.slot1 || commander.tactics.slot2 || commander.tactics.slot3 || commander.tactics.slot4) && (
                                                                <div className="mini-tactics">└ 兵法: {[commander.tactics.slot1, commander.tactics.slot2, commander.tactics.slot3, commander.tactics.slot4].filter(Boolean).join(', ')}</div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="formation-section">
                                    <div className="formation-section-title">内政武将</div>
                                    {formation.internalCommanders && formation.internalCommanders.filter(c => c.commanderName).length > 0 ? (
                                        formation.internalCommanders.map((commander, cmdIndex) => {
                                            if (!commander.commanderName) return null;
                                            return (
                                                <div key={cmdIndex} className="mini-team">
                                                    <div className="mini-commander">• {commander.commanderName}</div>
                                                    {commander.strategies.map((strat, sIndex) => {
                                                        if (!strat) return null;
                                                        return <div key={sIndex} className="mini-strategy">└ 戦法: {strat}</div>;
                                                    })}
                                                    {(commander.tactics.slot1 || commander.tactics.slot2 || commander.tactics.slot3 || commander.tactics.slot4) && (
                                                        <div className="mini-tactics">└ 兵法: {[commander.tactics.slot1, commander.tactics.slot2, commander.tactics.slot3, commander.tactics.slot4].filter(Boolean).join(', ')}</div>
                                                    )}
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <div style={{color: '#adb5bd', fontSize: '13px'}}>未設定</div>
                                    )}
                                </div>
                                <div className="action-buttons">
                                    <button className="btn" onClick={() => loadFormation(formation)}>📝 編集</button>
                                    <button className="btn btn-secondary" onClick={() => copyFormation(formation)}>📋 コピー</button>
                                    <button className="btn btn-danger" onClick={() => deleteFormation(formation)}>🗑️ 削除</button>
                                </div>
                            </div>
                        </div>
                    ))}
                    {imageModalSrc && (
                        <div className="image-modal-overlay" onClick={() => setImageModalSrc(null)}>
                            <button className="image-modal-close" onClick={() => setImageModalSrc(null)}>✕ 閉じる</button>
                            <div className="image-modal-content">
                                <img src={imageModalSrc} className="image-modal-img" />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
