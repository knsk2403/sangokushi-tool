<!DOCTYPE html>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const SHEET_ID = '1s3q3t9Hk_LuVLnGLSFmPhcF8PjUILy8-CvBXWBtaSvI';
        
        function App() {
            const [activeTab, setActiveTab] = useState('pvp');
            const [commanders, setCommanders] = useState([]);
            const [strategies, setStrategies] = useState([]);
            const [formations, setFormations] = useState([]);
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('未同期');
            const [editingFormationId, setEditingFormationId] = useState(null);
            
            // 編成データ
            const [formationName, setFormationName] = useState('');
            const [pvpTeams, setPvpTeams] = useState(Array(5).fill(null).map(() => ({
                soldierType: '槍',
                commanders: Array(3).fill(null).map(() => ({
                    commanderId: '',
                    strategies: ['', '']
                }))
            })));
            const [siegeTeams, setSiegeTeams] = useState(Array(5).fill(null).map(() => ({
                soldierType: '兵器',
                commanders: Array(3).fill(null).map(() => ({
                    commanderId: '',
                    strategies: ['', '']
                }))
            })));
            const [internalCommanders, setInternalCommanders] = useState(Array(10).fill(null).map(() => ({
                commanderId: '',
                strategies: ['', '']
            })));
            const [memo, setMemo] = useState('');

            // データ読み込み
            const loadData = useCallback(async () => {
                setLoading(true);
                setSyncStatus('読み込み中...');
                
                try {
                    // 武将データ読み込み
                    const commandersUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=武将一覧`;
                    const commandersResponse = await fetch(commandersUrl);
                    const commandersText = await commandersResponse.text();
                    const commandersParsed = Papa.parse(commandersText, { header: true });
                    
                    const commandersData = commandersParsed.data
                        .filter(row => row['武将名'] && row['武将名'].trim())
                        .map((row, index) => ({
                            id: index,
                            name: row['武将名'],
                            faction: row['陣営'] || '',
                            stars: parseInt(row['凸数']) || 0,
                            spear: row['槍'] || 'C',
                            bow: row['弓'] || 'C',
                            cavalry: row['馬'] || 'C',
                            shield: row['盾'] || 'C',
                            siege: row['兵器'] || 'C'
                        }));
                    
                    setCommanders(commandersData);

                    // 戦法データ読み込み
                    const strategiesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=戦法一覧`;
                    const strategiesResponse = await fetch(strategiesUrl);
                    const strategiesText = await strategiesResponse.text();
                    const strategiesParsed = Papa.parse(strategiesText, { header: true });
                    
                    const strategiesData = strategiesParsed.data
                        .filter(row => row['戦法名'] && row['戦法名'].trim())
                        .map((row, index) => ({
                            id: index,
                            name: row['戦法名'],
                            type: row['種類'] || '',
                            maxLearns: parseInt(row['学習数']) || 1,
                            learned: row['学習済み'] === 'TRUE' || row['学習済み'] === '○',
                            effect: row['効果'] || ''
                        }));
                    
                    setStrategies(strategiesData);

                    // 編成データ読み込み
                    try {
                        const formationsUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=編成`;
                        const formationsResponse = await fetch(formationsUrl);
                        const formationsText = await formationsResponse.text();
                        const formationsParsed = Papa.parse(formationsText, { header: true });
                        
                        const formationsData = formationsParsed.data
                            .filter(row => row['編成名'] && row['編成名'].trim())
                            .map((row, index) => {
                                try {
                                    return {
                                        id: index,
                                        name: row['編成名'],
                                        date: row['作成日'],
                                        pvpTeams: JSON.parse(row['対人戦部隊'] || '[]'),
                                        siegeTeams: JSON.parse(row['攻城部隊'] || '[]'),
                                        internalCommanders: JSON.parse(row['内政武将'] || '[]'),
                                        memo: row['メモ'] || ''
                                    };
                                } catch (e) {
                                    console.error('編成データのパースエラー:', e);
                                    return null;
                                }
                            })
                            .filter(f => f !== null);
                        
                        setFormations(formationsData);
                    } catch (e) {
                        console.log('編成シートが存在しないか、読み込みエラー');
                        setFormations([]);
                    }

                    setSyncStatus('同期完了');
                    setTimeout(() => setSyncStatus(''), 2000);
                } catch (error) {
                    console.error('データ読み込みエラー:', error);
                    setSyncStatus('エラー: ' + error.message);
                }
                
                setLoading(false);
            }, []);

            useEffect(() => {
                loadData();
            }, [loadData]);

            // 戦法使用状況を計算
            const calculateStrategyUsage = useCallback(() => {
                const usage = {};
                
                const countStrategies = (teams) => {
                    teams.forEach(team => {
                        team.commanders.forEach(commander => {
                            commander.strategies.forEach(strategyId => {
                                if (strategyId) {
                                    usage[strategyId] = (usage[strategyId] || 0) + 1;
                                }
                            });
                        });
                    });
                };

                countStrategies(pvpTeams);
                countStrategies(siegeTeams);
                internalCommanders.forEach(commander => {
                    commander.strategies.forEach(strategyId => {
                        if (strategyId) {
                            usage[strategyId] = (usage[strategyId] || 0) + 1;
                        }
                    });
                });

                return usage;
            }, [pvpTeams, siegeTeams, internalCommanders]);

            // 戦法選択の検証
            const validateStrategy = (strategyId) => {
                if (!strategyId) return { valid: true };
                
                const strategy = strategies.find(s => s.id === parseInt(strategyId));
                if (!strategy) return { valid: true };

                const usage = calculateStrategyUsage();
                const currentUsage = usage[strategyId] || 0;

                if (currentUsage > strategy.maxLearns) {
                    return {
                        valid: false,
                        error: `${strategy.name}は学習上限(${strategy.maxLearns}回)を超えています (使用: ${currentUsage}回)`
                    };
                }

                if (currentUsage === strategy.maxLearns) {
                    return {
                        valid: true,
                        warning: `${strategy.name}の学習回数が上限に達しています (${currentUsage}/${strategy.maxLearns})`
                    };
                }

                return {
                    valid: true,
                    info: `${strategy.name} (使用: ${currentUsage}/${strategy.maxLearns})`
                };
            };

            // スプレッドシートに保存
            const saveToSheet = async (formationData, isUpdate = false) => {
                try {
                    setSyncStatus('保存中...');
                    
                    // Google Apps Scriptのウェブアプリエンドポイントを使用
                    // 注: 実際に使用する前にGoogle Apps Scriptを設定する必要があります
                    const scriptUrl = 'https://script.google.com/macros/s/AKfycby7oGuBXMaOyreSIKKEYa8f3OL6r4pHdz1CvRNPnte3fUW6dqA7_1-eQwpz-D7Tw7Ys3A/exec'; // ここにGoogle Apps ScriptのURLを設定
                    
                    const response = await fetch(scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            action: isUpdate ? 'update' : 'create',
                            formationId: isUpdate ? editingFormationId : null,
                            data: {
                                name: formationData.name,
                                date: formationData.date,
                                pvpTeams: JSON.stringify(formationData.pvpTeams),
                                siegeTeams: JSON.stringify(formationData.siegeTeams),
                                internalCommanders: JSON.stringify(formationData.internalCommanders),
                                memo: formationData.memo
                            }
                        })
                    });
                    
                    setSyncStatus('保存完了');
                    setTimeout(() => setSyncStatus(''), 2000);
                    
                    // データを再読み込み
                    await loadData();
                    
                } catch (error) {
                    console.error('保存エラー:', error);
                    setSyncStatus('保存エラー');
                }
            };

            // 編成保存（モーダル表示）
            const [showSaveModal, setShowSaveModal] = useState(false);

            const handleSaveClick = () => {
                if (!formationName.trim()) {
                    alert('編成名を入力してください');
                    return;
                }
                
                if (editingFormationId !== null) {
                    setShowSaveModal(true);
                } else {
                    saveAsNew();
                }
            };

            const saveAsNew = async () => {
                const formationData = {
                    name: formationName,
                    date: new Date().toISOString().split('T')[0],
                    pvpTeams,
                    siegeTeams,
                    internalCommanders,
                    memo
                };

                await saveToSheet(formationData, false);
                setShowSaveModal(false);
                setEditingFormationId(null);
                resetForm();
                alert('新規編成として保存しました！');
            };

            const saveOverwrite = async () => {
                const formationData = {
                    name: formationName,
                    date: new Date().toISOString().split('T')[0],
                    pvpTeams,
                    siegeTeams,
                    internalCommanders,
                    memo
                };

                await saveToSheet(formationData, true);
                setShowSaveModal(false);
                setEditingFormationId(null);
                resetForm();
                alert('編成を上書き保存しました！');
            };

            const resetForm = () => {
                setFormationName('');
                setMemo('');
                setPvpTeams(Array(5).fill(null).map(() => ({
                    soldierType: '槍',
                    commanders: Array(3).fill(null).map(() => ({
                        commanderId: '',
                        strategies: ['', '']
                    }))
                })));
                setSiegeTeams(Array(5).fill(null).map(() => ({
                    soldierType: '兵器',
                    commanders: Array(3).fill(null).map(() => ({
                        commanderId: '',
                        strategies: ['', '']
                    }))
                })));
                setInternalCommanders(Array(10).fill(null).map(() => ({
                    commanderId: '',
                    strategies: ['', '']
                })));
            };

            // 編成読み込み
            const loadFormation = (formation) => {
                setEditingFormationId(formation.id);
                setFormationName(formation.name);
                setPvpTeams(formation.pvpTeams || []);
                setSiegeTeams(formation.siegeTeams || []);
                setInternalCommanders(formation.internalCommanders || []);
                setMemo(formation.memo || '');
                setActiveTab('pvp');
            };

            // 編成削除
            const deleteFormation = async (formationId) => {
                if (!confirm('この編成を削除しますか？')) return;
                
                try {
                    setSyncStatus('削除中...');
                    
                    const scriptUrl = 'https://script.google.com/macros/s/AKfycby7oGuBXMaOyreSIKKEYa8f3OL6r4pHdz1CvRNPnte3fUW6dqA7_1-eQwpz-D7Tw7Ys3A/exec';
                    await fetch(scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            action: 'delete',
                            formationId: formationId
                        })
                    });
                    
                    setSyncStatus('削除完了');
                    setTimeout(() => setSyncStatus(''), 2000);
                    await loadData();
                    
                } catch (error) {
                    console.error('削除エラー:', error);
                    setSyncStatus('削除エラー');
                }
            };

            if (loading) {
                return (
                    <div className="app-container">
                        <div className="header">
                            <h1>⚔️ 三国志新戦</h1>
                            <p>部隊編成ツール v2</p>
                        </div>
                        <div className="loading">
                            <div>データを読み込み中...</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>⚔️ 三国志新戦</h1>
                        <p>部隊編成ツール v2</p>
                        <div className="sync-status">
                            <span className={`status-indicator ${syncStatus === '読み込み中...' || syncStatus === '保存中...' ? 'status-loading' : syncStatus.includes('完了') ? 'status-success' : syncStatus.includes('エラー') ? 'status-error' : ''}`}></span>
                            {syncStatus || 'スタンバイ'}
                            <button className="sync-btn" onClick={loadData}>
                                🔄 再読込
                            </button>
                        </div>
                    </div>

                    <div className="tabs">
                        <button 
                            className={`tab ${activeTab === 'pvp' ? 'active' : ''}`}
                            onClick={() => setActiveTab('pvp')}
                        >
                            対人戦
                        </button>
                        <button 
                            className={`tab ${activeTab === 'siege' ? 'active' : ''}`}
                            onClick={() => setActiveTab('siege')}
                        >
                            攻城
                        </button>
                        <button 
                            className={`tab ${activeTab === 'internal' ? 'active' : ''}`}
                            onClick={() => setActiveTab('internal')}
                        >
                            内政
                        </button>
                        <button 
                            className={`tab ${activeTab === 'saved' ? 'active' : ''}`}
                            onClick={() => setActiveTab('saved')}
                        >
                            保存済み
                        </button>
                    </div>

                    <div className="content">
                        {activeTab === 'pvp' && (
                            <PvPTeams 
                                teams={pvpTeams}
                                setTeams={setPvpTeams}
                                commanders={commanders}
                                strategies={strategies}
                                validateStrategy={validateStrategy}
                            />
                        )}

                        {activeTab === 'siege' && (
                            <SiegeTeams 
                                teams={siegeTeams}
                                setTeams={setSiegeTeams}
                                commanders={commanders}
                                strategies={strategies}
                                validateStrategy={validateStrategy}
                            />
                        )}

                        {activeTab === 'internal' && (
                            <InternalCommanders 
                                internalCommanders={internalCommanders}
                                setInternalCommanders={setInternalCommanders}
                                commanders={commanders}
                                strategies={strategies}
                                validateStrategy={validateStrategy}
                            />
                        )}

                        {activeTab === 'saved' && (
                            <SavedFormations 
                                formations={formations}
                                commanders={commanders}
                                strategies={strategies}
                                loadFormation={loadFormation}
                                deleteFormation={deleteFormation}
                            />
                        )}

                        {activeTab !== 'saved' && (
                            <div className="section">
                                <div className="input-group">
                                    <label className="input-label">
                                        編成名 {editingFormationId !== null && '(編集中)'}
                                    </label>
                                    <input 
                                        type="text"
                                        value={formationName}
                                        onChange={(e) => setFormationName(e.target.value)}
                                        placeholder="例：シーズン3対人編成"
                                    />
                                </div>
                                <div className="input-group">
                                    <label className="input-label">メモ</label>
                                    <textarea 
                                        value={memo}
                                        onChange={(e) => setMemo(e.target.value)}
                                        placeholder="編成のコンセプトや注意点など"
                                    />
                                </div>
                                <button className="btn" onClick={handleSaveClick}>
                                    💾 編成を保存
                                </button>
                                {editingFormationId !== null && (
                                    <button className="btn btn-secondary" onClick={() => {
                                        setEditingFormationId(null);
                                        resetForm();
                                    }}>
                                        ✕ 編集をキャンセル
                                    </button>
                                )}
                            </div>
                        )}
                    </div>

                    {showSaveModal && (
                        <div className="modal-overlay" onClick={() => setShowSaveModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-title">保存方法を選択</div>
                                <div className="modal-text">
                                    既存の編成を編集中です。上書き保存しますか？それとも新規編成として保存しますか？
                                </div>
                                <div className="modal-buttons">
                                    <button className="btn btn-success" onClick={saveOverwrite}>
                                        上書き保存
                                    </button>
                                    <button className="btn" onClick={saveAsNew}>
                                        新規保存
                                    </button>
                                </div>
                                <button className="btn btn-secondary" style={{marginTop: '10px'}} onClick={() => setShowSaveModal(false)}>
                                    キャンセル
                                    </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 検索可能なセレクトコンポーネント
        function SearchableSelect({ value, onChange, options, placeholder, renderOption, renderValue }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            const containerRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (containerRef.current && !containerRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };

                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const filteredOptions = options.filter(option => 
                renderOption(option).toLowerCase().includes(searchTerm.toLowerCase())
            );

            const selectedOption = options.find(opt => opt.id === parseInt(value));

            return (
                <div className="search-select-container" ref={containerRef}>
                    {selectedOption ? (
                        <div className="selected-value">
                            {renderValue ? renderValue(selectedOption) : renderOption(selectedOption)}
                            <button 
                                className="clear-btn" 
                                onClick={() => {
                                    onChange('');
                                    setSearchTerm('');
                                }}
                            >
                                ✕
                            </button>
                        </div>
                    ) : (
                        <>
                            <input
                                type="text"
                                className="search-input"
                                value={searchTerm}
                                onChange={(e) => {
                                    setSearchTerm(e.target.value);
                                    setIsOpen(true);
                                }}
                                onFocus={() => setIsOpen(true)}
                                placeholder={placeholder}
                            />
                            {isOpen && filteredOptions.length > 0 && (
                                <div className="search-dropdown">
                                    {filteredOptions.map(option => (
                                        <div
                                            key={option.id}
                                            className="search-option"
                                            onClick={() => {
                                                onChange(option.id.toString());
                                                setSearchTerm('');
                                                setIsOpen(false);
                                            }}
                                        >
                                            {renderOption(option)}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }

        function PvPTeams({ teams, setTeams, commanders, strategies, validateStrategy }) {
            const updateTeam = (teamIndex, field, value) => {
                const updated = [...teams];
                updated[teamIndex] = { ...updated[teamIndex], [field]: value };
                setTeams(updated);
            };

            const updateCommander = (teamIndex, commanderIndex, field, value) => {
                const updated = [...teams];
                updated[teamIndex].commanders[commanderIndex] = {
                    ...updated[teamIndex].commanders[commanderIndex],
                    [field]: value
                };
                setTeams(updated);
            };

            const updateStrategy = (teamIndex, commanderIndex, strategyIndex, value) => {
                const updated = [...teams];
                updated[teamIndex].commanders[commanderIndex].strategies[strategyIndex] = value;
                setTeams(updated);
            };

            return (
                <div className="section">
                    <div className="section-title">対人戦部隊 (5部隊)</div>
                    <div className="team-grid">
                        {teams.map((team, teamIndex) => (
                            <div key={teamIndex} className="team-card">
                                <h3>部隊 {teamIndex + 1}</h3>
                                
                                <div className="input-group">
                                    <label className="input-label">兵種</label>
                                    <div className="soldier-types">
                                        {['槍', '弓', '馬', '盾'].map(type => (
                                            <button
                                                key={type}
                                                className={`soldier-type-btn ${team.soldierType === type ? 'active' : ''}`}
                                                onClick={() => updateTeam(teamIndex, 'soldierType', type)}
                                            >
                                                {type}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {team.commanders.map((commander, commanderIndex) => (
                                    <div key={commanderIndex} className="commander-slot">
                                        <div className="input-group">
                                            <label className="input-label">
                                                武将 {commanderIndex + 1}
                                                {commanderIndex === 0 && ' (主将)'}
                                            </label>
                                            <SearchableSelect
                                                value={commander.commanderId}
                                                onChange={(value) => updateCommander(teamIndex, commanderIndex, 'commanderId', value)}
                                                options={commanders}
                                                placeholder="武将を検索..."
                                                renderOption={(cmd) => `${cmd.name} [${cmd.faction}] ★${cmd.stars}`}
                                                renderValue={(cmd) => {
                                                    const aptKey = team.soldierType === '槍' ? 'spear' : 
                                                                  team.soldierType === '弓' ? 'bow' :
                                                                  team.soldierType === '馬' ? 'cavalry' : 'shield';
                                                    const apt = cmd[aptKey];
                                                    return (
                                                        <>
                                                            {cmd.name} [{cmd.faction}] ★{cmd.stars}
                                                            <span className={`aptitude-badge aptitude-${apt}`}>
                                                                {team.soldierType}: {apt}
                                                            </span>
                                                        </>
                                                    );
                                                }}
                                            />
                                        </div>

                                        <div className="strategy-slots">
                                            {commander.strategies.map((strategyId, strategyIndex) => (
                                                <div key={strategyIndex} className="strategy-slot">
                                                    <label className="input-label">戦法 {strategyIndex + 1}</label>
                                                    <SearchableSelect
                                                        value={strategyId}
                                                        onChange={(value) => updateStrategy(teamIndex, commanderIndex, strategyIndex, value)}
                                                        options={strategies}
                                                        placeholder="戦法を検索..."
                                                        renderOption={(strat) => `${strat.name} [${strat.type}] (学習${strat.maxLearns}回)`}
                                                    />
                                                    {strategyId && (() => {
                                                        const validation = validateStrategy(strategyId);
                                                        if (!validation.valid) {
                                                            return <div className="strategy-error">{validation.error}</div>;
                                                        }
                                                        if (validation.warning) {
                                                            return <div className="strategy-warning">{validation.warning}</div>;
                                                        }
                                                        if (validation.info) {
                                                            return <div className="strategy-info">{validation.info}</div>;
                                                        }
                                                    })()}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SiegeTeams({ teams, setTeams, commanders, strategies, validateStrategy }) {
            const updateCommander = (teamIndex, commanderIndex, field, value) => {
                const updated = [...teams];
                updated[teamIndex].commanders[commanderIndex] = {
                    ...updated[teamIndex].commanders[commanderIndex],
                    [field]: value
                };
                setTeams(updated);
            };

            const updateStrategy = (teamIndex, commanderIndex, strategyIndex, value) => {
                const updated = [...teams];
                updated[teamIndex].commanders[commanderIndex].strategies[strategyIndex] = value;
                setTeams(updated);
            };

            return (
                <div className="section">
                    <div className="section-title">攻城部隊 (5部隊)</div>
                    <div className="team-grid">
                        {teams.map((team, teamIndex) => (
                            <div key={teamIndex} className="team-card">
                                <h3>攻城部隊 {teamIndex + 1} [兵器]</h3>

                                {team.commanders.map((commander, commanderIndex) => (
                                    <div key={commanderIndex} className="commander-slot">
                                        <div className="input-group">
                                            <label className="input-label">
                                                武将 {commanderIndex + 1}
                                                {commanderIndex === 0 && ' (主将)'}
                                            </label>
                                            <SearchableSelect
                                                value={commander.commanderId}
                                                onChange={(value) => updateCommander(teamIndex, commanderIndex, 'commanderId', value)}
                                                options={commanders}
                                                placeholder="武将を検索..."
                                                renderOption={(cmd) => `${cmd.name} [${cmd.faction}] ★${cmd.stars}`}
                                                renderValue={(cmd) => (
                                                    <>
                                                        {cmd.name} [{cmd.faction}] ★{cmd.stars}
                                                        <span className={`aptitude-badge aptitude-${cmd.siege}`}>
                                                            兵器: {cmd.siege}
                                                        </span>
                                                    </>
                                                )}
                                            />
                                        </div>

                                        <div className="strategy-slots">
                                            {commander.strategies.map((strategyId, strategyIndex) => (
                                                <div key={strategyIndex} className="strategy-slot">
                                                    <label className="input-label">戦法 {strategyIndex + 1}</label>
                                                    <SearchableSelect
                                                        value={strategyId}
                                                        onChange={(value) => updateStrategy(teamIndex, commanderIndex, strategyIndex, value)}
                                                        options={strategies}
                                                        placeholder="戦法を検索..."
                                                        renderOption={(strat) => `${strat.name} [${strat.type}] (学習${strat.maxLearns}回)`}
                                                    />
                                                    {strategyId && (() => {
                                                        const validation = validateStrategy(strategyId);
                                                        if (!validation.valid) {
                                                            return <div className="strategy-error">{validation.error}</div>;
                                                        }
                                                        if (validation.warning) {
                                                            return <div className="strategy-warning">{validation.warning}</div>;
                                                        }
                                                        if (validation.info) {
                                                            return <div className="strategy-info">{validation.info}</div>;
                                                        }
                                                    })()}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function InternalCommanders({ internalCommanders, setInternalCommanders, commanders, strategies, validateStrategy }) {
            const updateCommander = (index, field, value) => {
                const updated = [...internalCommanders];
                updated[index] = { ...updated[index], [field]: value };
                setInternalCommanders(updated);
            };

            const updateStrategy = (index, strategyIndex, value) => {
                const updated = [...internalCommanders];
                updated[index].strategies[strategyIndex] = value;
                setInternalCommanders(updated);
            };

            return (
                <div className="section">
                    <div className="section-title">内政武将 (10人)</div>
                    <div className="internal-commanders">
                        {internalCommanders.map((commander, index) => (
                            <div key={index} className="internal-card">
                                <div className="internal-card-title">内政武将 {index + 1}</div>
                                
                                <div className="input-group">
                                    <label className="input-label">武将</label>
                                    <SearchableSelect
                                        value={commander.commanderId}
                                        onChange={(value) => updateCommander(index, 'commanderId', value)}
                                        options={commanders}
                                        placeholder="武将を検索..."
                                        renderOption={(cmd) => `${cmd.name} [${cmd.faction}] ★${cmd.stars}`}
                                    />
                                </div>

                                <div className="strategy-slots">
                                    {commander.strategies.map((strategyId, strategyIndex) => (
                                        <div key={strategyIndex} className="strategy-slot">
                                            <label className="input-label">戦法 {strategyIndex + 1}</label>
                                            <SearchableSelect
                                                value={strategyId}
                                                onChange={(value) => updateStrategy(index, strategyIndex, value)}
                                                options={strategies}
                                                placeholder="戦法を検索..."
                                                renderOption={(strat) => `${strat.name} [${strat.type}] (学習${strat.maxLearns}回)`}
                                            />
                                            {strategyId && (() => {
                                                const validation = validateStrategy(strategyId);
                                                if (!validation.valid) {
                                                    return <div className="strategy-error">{validation.error}</div>;
                                                }
                                                if (validation.warning) {
                                                    return <div className="strategy-warning">{validation.warning}</div>;
                                                }
                                                if (validation.info) {
                                                    return <div className="strategy-info">{validation.info}</div>;
                                                }
                                            })()}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SavedFormations({ formations, commanders, strategies, loadFormation, deleteFormation }) {
            if (formations.length === 0) {
                return (
                    <div className="empty-state">
                        <div className="empty-state-icon">📋</div>
                        <div>保存された編成はまだありません</div>
                        <p style={{fontSize: '14px', marginTop: '8px', color: '#6c757d'}}>
                            対人戦・攻城・内政タブで編成を作成して保存してください
                        </p>
                    </div>
                );
            }

            const getCommanderName = (commanderId) => {
                const commander = commanders.find(c => c.id === parseInt(commanderId));
                return commander ? commander.name : '未設定';
            };

            const getStrategyName = (strategyId) => {
                const strategy = strategies.find(s => s.id === parseInt(strategyId));
                return strategy ? strategy.name : '未設定';
            };

            return (
                <div className="section">
                    <div className="section-title">保存済み編成</div>
                    {formations.map((formation, index) => (
                        <div key={index} className="saved-formation-card">
                            <div className="formation-header">
                                <div>
                                    <div className="formation-title">{formation.name}</div>
                                    <div className="formation-date">作成日: {formation.date}</div>
                                </div>
                            </div>

                            {formation.memo && (
                                <div style={{
                                    background: '#f8f9fa',
                                    padding: '10px',
                                    borderRadius: '6px',
                                    fontSize: '13px',
                                    color: '#495057',
                                    marginTop: '12px',
                                    marginBottom: '12px'
                                }}>
                                    {formation.memo}
                                </div>
                            )}

                            <div className="formation-section">
                                <div className="formation-section-title">対人戦部隊</div>
                                {formation.pvpTeams && formation.pvpTeams.map((team, teamIndex) => {
                                    const hasCommanders = team.commanders.some(c => c.commanderId);
                                    if (!hasCommanders) return null;
                                    
                                    return (
                                        <div key={teamIndex} className="mini-team">
                                            <div className="mini-team-title">
                                                部隊{teamIndex + 1} [{team.soldierType}]
                                            </div>
                                            {team.commanders.map((commander, cmdIndex) => {
                                                if (!commander.commanderId) return null;
                                                return (
                                                    <div key={cmdIndex}>
                                                        <div className="mini-commander">
                                                            • {getCommanderName(commander.commanderId)}
                                                        </div>
                                                        {commander.strategies.map((strategyId, sIndex) => {
                                                            if (!strategyId) return null;
                                                            return (
                                                                <div key={sIndex} className="mini-strategy">
                                                                    └ {getStrategyName(strategyId)}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="formation-section">
                                <div className="formation-section-title">攻城部隊</div>
                                {formation.siegeTeams && formation.siegeTeams.map((team, teamIndex) => {
                                    const hasCommanders = team.commanders.some(c => c.commanderId);
                                    if (!hasCommanders) return null;
                                    
                                    return (
                                        <div key={teamIndex} className="mini-team">
                                            <div className="mini-team-title">
                                                攻城{teamIndex + 1} [兵器]
                                            </div>
                                            {team.commanders.map((commander, cmdIndex) => {
                                                if (!commander.commanderId) return null;
                                                return (
                                                    <div key={cmdIndex}>
                                                        <div className="mini-commander">
                                                            • {getCommanderName(commander.commanderId)}
                                                        </div>
                                                        {commander.strategies.map((strategyId, sIndex) => {
                                                            if (!strategyId) return null;
                                                            return (
                                                                <div key={sIndex} className="mini-strategy">
                                                                    └ {getStrategyName(strategyId)}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="formation-section">
                                <div className="formation-section-title">内政武将</div>
                                {formation.internalCommanders && formation.internalCommanders.map((commander, cmdIndex) => {
                                    if (!commander.commanderId) return null;
                                    return (
                                        <div key={cmdIndex} className="mini-team">
                                            <div className="mini-commander">
                                                • {getCommanderName(commander.commanderId)}
                                            </div>
                                            {commander.strategies.map((strategyId, sIndex) => {
                                                if (!strategyId) return null;
                                                return (
                                                    <div key={sIndex} className="mini-strategy">
                                                        └ {getStrategyName(strategyId)}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                })}
                                {(!formation.internalCommanders || formation.internalCommanders.filter(c => c.commanderId).length === 0) && (
                                    <div className="mini-team">
                                        <div className="mini-commander" style={{color: '#adb5bd'}}>未設定</div>
                                    </div>
                                )}
                            </div>

                            <div className="action-buttons">
                                <button 
                                    className="btn"
                                    onClick={() => loadFormation(formation)}
                                >
                                    📝 編集
                                </button>
                                <button 
                                    className="btn btn-danger"
                                    onClick={() => deleteFormation(formation.id)}
                                >
                                    🗑️ 削除
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // アプリをレンダリング
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
